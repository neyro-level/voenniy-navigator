on:
  # Empty paths are the explicit never-trigger sentinel. Manual headless runs
  # remain available for the one final exact-head gate selected by risk.
  push:
    - workflows: [merge-standard, merge-risky]
      filter:
        paths: []

  pull_request:
    - workflows: [merge-standard, merge-risky]
      filter:
        paths: []

workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Full immutable SHA of the reviewed Pull Request head.
    tasks:
      - name: verify-exact-head-standard
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: node-24-light
            image: docker.io/library/node:24.21.0-bookworm-slim
            script:
              - bash scripts/ci/sourcecraft-standard.sh

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Full immutable SHA of the reviewed Pull Request head.
      risk_scope:
        type: choice
        required: true
        description: Only the affected high-risk boundary.
        options:
          - runtime-release
          - seo-geo
          - dependencies
    tasks:
      - name: verify-exact-head
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          RISK_SCOPE: ${{ inputs.risk_scope }}
        cubes:
          - name: node-24-build
            image: docker.io/library/node:24.21.0-bookworm-slim
            script:
              - bash scripts/ci/sourcecraft-risky.sh

  release-single-build:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Exact release-candidate SHA.
      gate_run_slug:
        type: string
        required: true
        description: API-verified green Merge Gate run for the same SHA.
      previous_release_sha:
        type: string
        required: true
        description: Full SHA of the known-good rollback release.
      previous_release_id:
        type: string
        required: true
        description: Server release directory of the known-good rollback target.
      store_release_tag:
        type: string
        required: true
        description: Unpublished SourceCraft Release tag used as durable artifact storage.
    tasks:
      - name: prepare-static-release-unit
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          GATE_RUN_SLUG: ${{ inputs.gate_run_slug }}
          PREVIOUS_RELEASE_SHA: ${{ inputs.previous_release_sha }}
          PREVIOUS_RELEASE_ID: ${{ inputs.previous_release_id }}
          STORE_RELEASE_TAG: ${{ inputs.store_release_tag }}
        cubes:
          - name: build-pack-rehearse
            image: docker.io/library/node:24.21.0-bookworm-slim
            script:
              - bash scripts/ci/sourcecraft-release.sh
            artifacts:
              paths:
                - release-output/release.tar.gz.part-00
                - release-output/release.tar.gz.part-01
                - release-output/release.tar.gz.part-02
                - release-output/release.tar.gz.sha256
                - release-output/RELEASE_PARTS.json
                - release-output/RELEASE_EVIDENCE.json
                - release-output/REHEARSAL_RESULT.txt
