on:
  # Empty paths are the explicit never-trigger sentinel. Manual headless runs
  # remain available for the one final exact-head gate selected by risk.
  push:
    - workflows: [merge-standard, merge-risky]
      filter:
        paths: []

  pull_request:
    - workflows: [merge-standard, merge-risky]
      filter:
        paths: []

workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Full immutable SHA of the reviewed Pull Request head.
    tasks:
      - name: verify-exact-head-standard
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: node-24-light
            image: docker.io/library/node:24.21.0-bookworm-slim
            script:
              - bash scripts/ci/sourcecraft-standard.sh

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Full immutable SHA of the reviewed Pull Request head.
      risk_scope:
        type: choice
        required: true
        description: Only the affected high-risk boundary.
        options:
          - runtime-release
          - seo-geo
          - dependencies
    tasks:
      - name: verify-exact-head
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          RISK_SCOPE: ${{ inputs.risk_scope }}
        cubes:
          - name: node-24-build
            image: docker.io/library/node:24.21.0-bookworm-slim
            script:
              - bash scripts/ci/sourcecraft-risky.sh

  publish-release:
    inputs:
      expected_main_sha:
        type: string
        required: true
        description: Full immutable SHA of the clean SourceCraft main commit to package.
    tasks:
      - name: publish-static-artifact
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        cubes:
          - name: node-24-artifact
            image: docker.io/library/node:24.21.0-bookworm-slim
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - node scripts/verify-sourcecraft-release.mjs
              - pnpm install --frozen-lockfile
              - pnpm build
              - pnpm geo-check
              - node scripts/prepare-release-artifact.mjs
            artifacts:
              paths:
                - dist/**
                - .release/**
